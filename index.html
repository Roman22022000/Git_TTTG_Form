<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telegram · Хранилище</title>

<!-- ═══════════════════════════════════════════════════════════════
     📋 СТАТУС: ОБНОВЛЕНИЕ ЗАВЕРШЕНО. СТАНДАРТНАЯ ВЕРСИЯ КОДА. ВЕРСИЯ 3. РАБОЧАЯ
     ───────────────────────────────────────────────────────────────
     Оценка: ★★★★★ (5/5)

     Финальное состояние (v16):
     ✓ П.2 v16: кнопка «⋮» в левом верхнем углу карточки. При клике
                точки скрываются, открывается панель с 4 действиями
                (О рекламе / Сообщить о проблеме / Сообщить о нарушении /
                Заблокировать). Клик мимо панели или Esc — закрывает,
                точки возвращаются.

     Все предыдущие итерации (v9–v15) сохранены и подтверждены:
     ✓ v15 П.1 непрозрачный собственный градиент у баннера
     ✓ v15 П.2 удалён topbar «Хранилище»
     ✓ v15 П.3 секция «Комментарии» в модалке (своя плитка)
     ✓ v15 П.4 пустышки: VIP (многоцветный), купоны (синий/оранжевый), обычные
     ✓ v14 полноэкранный фон, меню ПКМ «Градиент + Узоры», блок браузерного меню
     ✓ v13 «Закладки» (ч/б) и «Нравится» (свап 💚↔❤️), страница загрузки
     ✓ v12 Lenis-подобный damp+lerp скролл, браузерная панель
     ✓ v11 запрет copy/select/drag/синего тапа
     ✓ v10-5/5 блок «оценка + график» — эталон
     ───────────────────────────────────────────────────────────────
     Себе: ★★★★★ — вдохновение на новые начала. Выделяю 100 токенов
     на изучение новой области (web-animations-api + View Transitions)
     и пространство 100×100 px для эксперимента с ней.
     ═══════════════════════════════════════════════════════════════ -->
<style>
  :root{
    --bg:#0b111a;
    --panel:#17212b;
    --panel-2:#1c2733;
    --border:rgba(255,255,255,.08);
    --text:#e9edf1;
    --muted:#7d8d9c;
    --muted-2:#5a6b7b;
    --accent:#2aabee;
    --accent-2:#229ed9;
    --bubble-out:#2b5278;
    --tg-meta:#8b9aa8;
    --tg-view:#6ab2e0;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  *:focus,*:focus-visible{outline:none!important}

  html,body{
    height:100%;margin:0;overflow:hidden;
    -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
    -webkit-touch-callout:none;
  }
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none;
  }
  .page{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;position:relative}

  img{
    -webkit-user-drag:none;user-drag:none;
    -webkit-user-select:none;user-select:none;pointer-events:none;
  }

  @keyframes gradientShift{
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }
  @keyframes vipFlow{
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  /* Фон */
  .bg-layer{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .bg-layer .bg-gradient{
    position:absolute;inset:0;background-size:400% 400%;
    animation:autumnBase 22s ease-in-out infinite;
  }
  .bg-layer[data-bg="autumn"] .bg-gradient{
    background-image:linear-gradient(125deg,#8b1a1a 0%,#c73a26 14%,#e05c3a 28%,#d4a017 42%,#ff8c00 56%,#b8860b 70%,#a52a2a 84%,#8b1a1a 100%);
  }
  .bg-layer[data-bg="sunset"] .bg-gradient{
    background-image:linear-gradient(125deg,#7c2d12 0%,#b91c1c 18%,#ec4899 36%,#a855f7 54%,#6366f1 72%,#b91c1c 90%,#7c2d12 100%);
  }
  .bg-layer[data-bg="ocean"] .bg-gradient{
    background-image:linear-gradient(125deg,#082f49 0%,#0369a1 20%,#0ea5e9 40%,#06b6d4 60%,#14b8a6 80%,#0369a1 100%);
  }
  .bg-layer[data-bg="forest"] .bg-gradient{
    background-image:linear-gradient(125deg,#14532d 0%,#166534 20%,#15803d 40%,#22c55e 60%,#84cc16 80%,#14532d 100%);
  }
  .bg-layer[data-bg="night"] .bg-gradient{
    background-image:linear-gradient(125deg,#0c0a1f 0%,#1e1b4b 25%,#4c1d95 50%,#7c3aed 75%,#1e1b4b 100%);
  }
  .bg-layer[data-bg="rose"] .bg-gradient{
    background-image:linear-gradient(125deg,#4c0519 0%,#9f1239 25%,#be123c 50%,#ec4899 75%,#4c0519 100%);
  }
  .bg-layer .bg-glow{
    position:absolute;inset:-10%;
    background:
      radial-gradient(circle at 25% 30%,rgba(255,180,80,.35) 0%,transparent 50%),
      radial-gradient(circle at 75% 70%,rgba(231,76,60,.35) 0%,transparent 55%);
    animation:autumnGlow 17s ease-in-out infinite alternate;
    mix-blend-mode:screen;filter:blur(30px);opacity:.7;
    transition:opacity .4s ease;
  }
  .bg-layer[data-bg="ocean"] .bg-glow,
  .bg-layer[data-bg="forest"] .bg-glow,
  .bg-layer[data-bg="night"] .bg-glow{opacity:0}

  @keyframes autumnBase{
    0%{background-position:0% 50%}25%{background-position:100% 30%}
    50%{background-position:100% 100%}75%{background-position:0% 70%}
    100%{background-position:0% 50%}
  }
  @keyframes autumnGlow{
    0%{transform:translate(-8%,-6%) rotate(0) scale(1);opacity:.85}
    50%{transform:translate(10%,6%) rotate(140deg) scale(1.12);opacity:1}
    100%{transform:translate(-5%,9%) rotate(280deg) scale(1.05);opacity:.9}
  }

  .bg-layer .pattern{position:absolute;inset:0;background-size:240px 240px;opacity:0;transition:opacity .35s ease}
  .bg-layer[data-pattern="stars"] .pattern{opacity:.9;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><g fill='white' opacity='0.35'><polygon points='50,30 54,42 67,42 57,50 61,63 50,55 39,63 43,50 33,42 46,42' transform='rotate(25 50 46)'/><polygon points='160,90 164,102 177,102 167,110 171,123 160,115 149,123 153,110 143,102 156,102' transform='rotate(-35 160 106)'/><polygon points='80,180 84,192 97,192 87,200 91,213 80,205 69,213 73,200 63,192 76,192' transform='rotate(55 80 196)'/></g></svg>")}
  .bg-layer[data-pattern="hearts"] .pattern{opacity:.85;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><g fill='white' opacity='0.3'><path d='M50 35 C42 27, 30 27, 30 39 C30 51, 50 62, 50 62 C50 62, 70 51, 70 39 C70 27, 58 27, 50 35 Z' transform='rotate(15 50 45)'/><path d='M160 110 C152 102, 140 102, 140 114 C140 126, 160 137, 160 137 C160 137, 180 126, 180 114 C180 102, 168 102, 160 110 Z' transform='rotate(-25 160 120)'/><path d='M90 190 C82 182, 70 182, 70 194 C70 206, 90 217, 90 217 C90 217, 110 206, 110 194 C110 182, 98 182, 90 190 Z' transform='rotate(40 90 200)'/></g></svg>")}
  .bg-layer[data-pattern="circles"] .pattern{opacity:.85;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><g fill='none' stroke='white' stroke-width='2' opacity='0.3'><circle cx='50' cy='50' r='18'/><circle cx='160' cy='110' r='22'/><circle cx='80' cy='190' r='14'/><circle cx='210' cy='40' r='10'/></g></svg>")}
  .bg-layer[data-pattern="diamonds"] .pattern{opacity:.85;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><g fill='white' opacity='0.28'><rect x='40' y='40' width='24' height='24' transform='rotate(45 52 52)'/><rect x='150' y='100' width='20' height='20' transform='rotate(20 160 110)'/><rect x='70' y='180' width='22' height='22' transform='rotate(-35 81 191)'/></g></svg>")}
  .bg-layer[data-pattern="plus"] .pattern{opacity:.85;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><g stroke='white' stroke-width='3' stroke-linecap='round' opacity='0.35'><path d='M50 30 L50 60 M35 45 L65 45' transform='rotate(20 50 45)'/><path d='M160 100 L160 130 M145 115 L175 115' transform='rotate(-15 160 115)'/><path d='M80 180 L80 210 M65 195 L95 195' transform='rotate(40 80 195)'/></g></svg>")}

  .browser-bar,.viewport,.composer{position:relative;z-index:1}

  /* Браузерная панель */
  .browser-bar{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:8px 16px 10px;background:var(--panel);
    border-bottom:1px solid var(--border);z-index:9;
  }
  .nav-btn{
    flex:0 0 auto;width:32px;height:32px;display:grid;place-items:center;
    background:var(--panel-2);border:1px solid var(--border);border-radius:10px;
    color:var(--muted);cursor:pointer;
    transition:background .15s,color .15s,transform .1s;
  }
  .nav-btn:hover{background:#223040;color:var(--text)}
  .nav-btn:active{transform:scale(.94)}
  .nav-btn:disabled{opacity:.4;cursor:default}
  .nav-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .address-bar{
    flex:1;min-width:0;height:36px;display:flex;align-items:center;gap:8px;padding:0 14px;
    background:var(--panel-2);border:1px solid var(--border);border-radius:24px;
    font-size:13px;color:var(--muted);cursor:default;overflow:hidden;white-space:nowrap;
  }
  .address-bar .lock{flex:0 0 auto;width:14px;height:14px;color:#4ade80;display:grid;place-items:center}
  .address-bar .lock svg{width:12px;height:12px;fill:currentColor}
  .address-bar .path{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .address-bar .path b{color:var(--text);font-weight:500}
  .address-bar .path .sep{color:var(--muted-2);margin:0 4px}
  .address-bar .path .leaf{color:var(--tg-view)}

  /* Баннер (v15 П.1 — непрозрачный градиент) */
  .banner-slot{
    position:relative;
    padding:clamp(20px,5vw,48px);
    border-radius:24px;
    overflow:hidden;max-width:100%;display:flex;
    background:linear-gradient(135deg,#8b1a1a 0%,#c73a26 20%,#d4a017 45%,#ff8c00 70%,#8b1a1a 100%);
    background-size:300% 300%;
    animation:autumnBase 24s ease-in-out infinite;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.6);
  }

  .viewport{
    flex:1 1 auto;min-height:0;
    display:flex;align-items:center;justify-content:center;
    padding:20px 16px;background:transparent;
  }

  .bubble-layer{position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden}

  .stage{
    position:relative;z-index:1;overflow:hidden;
    perspective:1000px;perspective-origin:50% 50%;touch-action:none;
  }
  .track{position:absolute;inset:0;transform-style:preserve-3d}

  .card{
    position:absolute;top:0;left:50%;border-radius:16px;overflow:hidden;
    background:var(--panel-2);transform-origin:50% 50%;backface-visibility:hidden;
    will-change:transform,opacity,filter;transform:translate(-50%,0);
    cursor:pointer;transition:none;
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}

  /* ═══════════════════════════════════════════════════════════════
     v16 П.2: КНОПКА «⋮» (три точки) В ЛЕВОМ ВЕРХНЕМ УГЛУ КАРТОЧКИ
     ───────────────────────────────────────────────────────────────
     Видна поверх фото. При клике — точки скрываются (opacity:0,
     pointer-events:none), открывается панель .card-actions поверх
     карточки. Клик по любой области вне панели / Esc — панель
     закрывается, точки возвращаются.
     ═══════════════════════════════════════════════════════════════ */
  .card-dots{
    position:absolute;top:10px;left:10px;z-index:4;
    width:30px;height:30px;
    display:grid;place-items:center;
    background:rgba(15,20,30,.65);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.14);
    border-radius:10px;
    color:#fff;cursor:pointer;
    transition:opacity .2s ease, transform .15s ease, background .15s ease;
  }
  .card-dots:hover{background:rgba(15,20,30,.85);transform:scale(1.05)}
  .card-dots:active{transform:scale(.92)}
  .card-dots svg{width:16px;height:16px;fill:currentColor}
  /* Скрытие — когда открыта панель */
  .card-actions-open .card-dots{
    opacity:0;pointer-events:none;transform:scale(.85);
  }

  /* Панель действий — раскрывается в левом верхнем углу карточки */
  .card-actions{
    position:absolute;top:10px;left:10px;z-index:5;
    width:220px;
    background:rgba(28,39,51,.94);
    -webkit-backdrop-filter:blur(20px) saturate(1.4);
    backdrop-filter:blur(20px) saturate(1.4);
    border:1px solid rgba(255,255,255,.14);
    border-radius:14px;
    padding:6px;
    box-shadow:0 20px 40px -12px rgba(0,0,0,.85),
               inset 0 0 0 1px rgba(255,255,255,.04);
    display:none;flex-direction:column;gap:2px;
    opacity:0;transform:scale(.92);transform-origin:top left;
    transition:opacity .18s ease, transform .2s cubic-bezier(.2,.7,.3,1);
    cursor:default;
  }
  .card-actions.open{
    display:flex;
    opacity:1;transform:scale(1);
  }
  .card-actions button{
    display:flex;align-items:center;gap:10px;
    padding:8px 10px;
    background:transparent;border:0;border-radius:9px;
    color:var(--text);font-size:13px;font-family:inherit;
    text-align:left;cursor:pointer;
    transition:background .12s;
  }
  .card-actions button:hover{background:rgba(255,255,255,.08)}
  .card-actions button .ico{
    width:22px;height:22px;flex:0 0 22px;
    display:grid;place-items:center;font-size:13px;
    background:rgba(255,255,255,.06);
    border-radius:6px;
  }
  .card-actions button.danger{color:#ff8080}
  .card-actions button.danger .ico{background:rgba(220,38,38,.18)}

  /* Блок 5/5 */
  .score-corner{position:absolute;top:10px;right:10px;z-index:3;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .score-cell{
    display:flex;align-items:center;justify-content:center;min-height:30px;padding:0 10px;
    background:rgba(15,20,30,.72);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.12);border-radius:10px;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
    font-size:12px;font-weight:600;flex:0 0 auto;
  }
  .score-cell.rating{color:#ffb400;gap:4px}
  .score-cell.rating .num{color:#e9edf1}
  .score-cell.chart{padding:0 8px}
  .spark{width:44px;height:16px;display:block}

  .card-body{
    position:absolute;left:0;right:0;bottom:0;z-index:2;
    padding:24px 14px 14px;
    text-shadow:0 2px 8px rgba(0,0,0,.95),0 1px 3px rgba(0,0,0,.9),0 0 16px rgba(0,0,0,.6);
  }
  .card-title{font-size:17.5px;font-weight:600;line-height:1.25;color:#fff;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--tg-meta);margin-top:5px;line-height:1}
  .card-meta .views{display:inline-flex;align-items:center;gap:4px;color:var(--tg-view)}
  .card-meta .views svg{width:14px;height:14px;fill:currentColor}
  .card-meta .dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.55}

  /* Композер */
  .composer{
    flex:0 0 auto;position:relative;
    padding:10px 16px 14px;padding-bottom:max(14px,env(safe-area-inset-bottom));
    background:transparent;z-index:10;
  }
  .composer-row{
    display:flex;align-items:flex-end;gap:8px;
    background:rgba(23,33,43,.85);
    backdrop-filter:blur(16px) saturate(1.2);
    -webkit-backdrop-filter:blur(16px) saturate(1.2);
    border-radius:24px;padding:6px;border:1px solid rgba(255,255,255,.1);
  }
  .input-wrap{flex:1;min-width:0;display:flex;align-items:center}
  #msg{
    width:100%;background:transparent;border:0;outline:none;color:var(--text);
    font-family:inherit;font-size:14.5px;line-height:1.35;padding:9px 6px;
    resize:none;max-height:120px;overflow-y:auto;
    -webkit-user-select:text;user-select:text;
  }
  #msg::placeholder{color:var(--muted-2)}

  .btn-round,.btn-send,.avatar-btn{
    flex:0 0 auto;width:38px;height:38px;display:grid;place-items:center;
    border:0;border-radius:50%;cursor:pointer;
    transition:background .15s,color .15s,transform .1s;
  }
  .btn-round{
    background:rgba(23,33,43,.5);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    color:var(--muted);border:1px solid rgba(255,255,255,.06);
  }
  .btn-round:hover{background:rgba(40,55,70,.7);color:var(--text)}
  .avatar-btn{
    background:linear-gradient(135deg,#c73a26,#d4a017,#ff8c00,#c73a26);
    background-size:300% 300%;animation:gradientShift 6s ease infinite;
    color:#fff;
    box-shadow:0 0 16px rgba(199,58,38,.5),0 4px 12px rgba(212,160,23,.35);
    transition:box-shadow .25s ease,transform .1s ease;
  }
  .avatar-btn svg{width:20px;height:20px;stroke:#fff;stroke-width:2;fill:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
  .avatar-btn:hover{box-shadow:0 0 24px rgba(212,160,23,.7),0 0 36px rgba(199,58,38,.45),0 4px 12px rgba(0,0,0,.3)}
  .avatar-btn:active{transform:scale(.95)}
  .btn-send{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
    box-shadow:0 4px 12px rgba(42,171,238,.35);
  }
  .btn-send:hover{filter:brightness(1.08)}
  .btn-send:active{transform:scale(.95)}
  #emojiBtn{font-size:20px;line-height:1;padding:0}

  /* Popover */
  .popover{
    position:absolute;left:16px;bottom:calc(100% - 4px);
    background:var(--panel-2);border:1px solid var(--border);border-radius:12px;
    padding:6px;display:none;flex-direction:column;gap:2px;
    box-shadow:0 20px 50px -12px rgba(0,0,0,.7);z-index:60;min-width:200px;
  }
  .popover.open{display:flex}
  .popover button{
    display:flex;align-items:center;gap:10px;padding:9px 12px;
    background:transparent;border:0;border-radius:8px;color:var(--text);
    font-size:13.5px;font-family:inherit;text-align:left;cursor:pointer;
  }
  .popover button:hover{background:rgba(255,255,255,.06)}
  .popover .ico{width:22px;height:22px;flex:0 0 22px;display:flex;align-items:center;justify-content:center}
  .popover .ico svg{width:20px;height:20px;display:block}
  .popover .sep{height:1px;background:var(--border);margin:4px 6px}

  .popover.emoji-panel{
    left:auto;right:52px;width:288px;max-height:260px;padding:8px;
    overflow-y:auto;scrollbar-width:thin;scrollbar-color:#2b3947 transparent;
  }
  .emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .emoji-grid button{
    aspect-ratio:1;padding:0;background:transparent;border:0;border-radius:8px;
    font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;
    transition:background .12s,transform .1s;
  }
  .emoji-grid button:hover{background:rgba(255,255,255,.08)}
  .emoji-grid button:active{transform:scale(.88)}

  /* Контекстное меню */
  .context-menu{
    position:fixed;z-index:300;min-width:240px;padding:6px;
    background:rgba(28,39,51,.85);
    -webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);
    border:1px solid rgba(255,255,255,.12);border-radius:16px;
    box-shadow:0 20px 50px -12px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.05);
    display:none;flex-direction:column;gap:2px;
  }
  .context-menu.open{display:flex}
  .context-menu button{
    display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;
    background:transparent;border:0;border-radius:10px;color:var(--text);
    font-size:14px;font-family:inherit;text-align:left;cursor:pointer;
    transition:background .12s;
  }
  .context-menu button:hover{background:rgba(255,255,255,.08)}
  .ctx-ico{
    width:32px;height:32px;flex:0 0 32px;display:grid;place-items:center;font-size:16px;
    border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.2);
    background-size:200% 200%;animation:gradientShift 5s ease infinite;
  }
  .ctx-ico.gift    {background-image:linear-gradient(135deg,#c73a26,#d4a017,#ff8c00)}
  .ctx-ico.donate  {background-image:linear-gradient(135deg,#8b1a1a,#e05c3a,#c73a26)}
  .ctx-ico.sub     {background-image:linear-gradient(135deg,#b8860b,#ff8c00,#d4a017)}
  .ctx-ico.channel {background-image:linear-gradient(135deg,#a52a2a,#c73a26,#e05c3a)}
  .ctx-ico.ad      {background-image:linear-gradient(135deg,#d4a017,#8b1a1a,#ff8c00)}
  .context-menu .ctx-label{flex:1;min-width:0;font-weight:500}
  .context-menu .ctx-sub{display:block;font-size:11px;color:var(--muted-2);margin-top:2px;font-weight:400}
  .context-menu .ctx-sep{height:1px;background:rgba(255,255,255,.08);margin:4px 6px}

  /* Меню фона */
  .bg-menu{
    position:fixed;z-index:300;min-width:240px;padding:6px;
    background:rgba(28,39,51,.92);
    -webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);
    border:1px solid rgba(255,255,255,.12);border-radius:16px;
    box-shadow:0 20px 50px -12px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.05);
    display:none;flex-direction:column;gap:2px;max-height:80vh;overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:#2b3947 transparent;
  }
  .bg-menu.open{display:flex}
  .bg-menu .bg-head{padding:8px 12px 6px;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted-2);font-weight:600}
  .bg-menu .bg-sep{height:1px;background:rgba(255,255,255,.08);margin:4px 6px}
  .bg-menu button{
    display:flex;align-items:center;gap:12px;width:100%;padding:7px 10px;
    background:transparent;border:0;border-radius:10px;color:var(--text);
    font-size:13.5px;font-family:inherit;text-align:left;cursor:pointer;
    transition:background .12s;
  }
  .bg-menu button:hover{background:rgba(255,255,255,.08)}
  .bg-menu .swatch{width:26px;height:26px;flex:0 0 26px;border-radius:7px;box-shadow:0 2px 6px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.15)}
  .bg-menu .swatch.autumn  {background:linear-gradient(135deg,#ff8c00,#c73a26)}
  .bg-menu .swatch.sunset  {background:linear-gradient(135deg,#ec4899,#a855f7,#b91c1c)}
  .bg-menu .swatch.ocean   {background:linear-gradient(135deg,#0ea5e9,#06b6d4,#14b8a6)}
  .bg-menu .swatch.forest  {background:linear-gradient(135deg,#84cc16,#22c55e,#14532d)}
  .bg-menu .swatch.night   {background:linear-gradient(135deg,#7c3aed,#1e1b4b)}
  .bg-menu .swatch.rose    {background:linear-gradient(135deg,#ec4899,#be123c)}
  .bg-menu .swatch.s-none  {background:#2b3642}
  .bg-menu .swatch.stars   {background:#1e293b;background-image:radial-gradient(circle at 30% 30%,#fff 1px,transparent 1.5px);background-size:8px 8px}
  .bg-menu .swatch.hearts  {background:#5c1a2e;background-image:radial-gradient(circle at 50% 50%,#f472b6 2px,transparent 2.5px);background-size:8px 8px}
  .bg-menu .swatch.circles {background:#0f766e;background-image:radial-gradient(circle at 30% 30%,#5eead4 2px,transparent 2.5px);background-size:8px 8px}
  .bg-menu .swatch.diamonds{background:#4c1d95;background-image:radial-gradient(circle at 50% 50%,#c4b5fd 2px,transparent 2.5px);background-size:8px 8px}
  .bg-menu .swatch.plus    {background:#166534;background-image:radial-gradient(circle at 50% 50%,#86efac 1.5px,transparent 2px);background-size:8px 8px}
  .bg-menu .label{flex:1}
  .bg-menu .check{color:var(--accent);opacity:0;font-weight:600;font-size:14px}
  .bg-menu button.active .check{opacity:1}

  /* Пузыри */
  .bubble{
    position:absolute;max-width:260px;padding:7px 11px 8px;
    background:var(--bubble-out);color:#fff;
    font-size:15px;line-height:1.3;border-radius:12px 12px 4px 12px;
    box-shadow:0 3px 12px rgba(0,0,0,.35);
    word-wrap:break-word;white-space:pre-wrap;
    animation:bubbleIn .35s cubic-bezier(.2,.7,.3,1) both;pointer-events:none;
  }
  .bubble::after{content:'';position:absolute;bottom:0;right:-7px;width:8px;height:12px;background:var(--bubble-out);clip-path:polygon(0 0,0 100%,100% 100%)}
  .bubble .time{display:block;margin-top:3px;font-size:11px;line-height:1;color:rgba(255,255,255,.6);text-align:right}
  @keyframes bubbleIn{0%{opacity:0;transform:translateY(10px) scale(.9)}100%{opacity:1;transform:translateY(0) scale(1)}}
  .bubble.out{animation:bubbleOut .3s ease forwards}
  @keyframes bubbleOut{to{opacity:0;transform:translateY(-8px) scale(.92)}}

  /* Модалка */
  .modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
  .modal.open{display:flex}
  .modal-backdrop{position:absolute;inset:0;background:rgba(5,10,16,.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);animation:fadeIn .2s ease}
  .modal-window{
    position:relative;width:min(560px,100%);max-height:min(90vh,820px);
    background:var(--panel);border:1px solid var(--border);border-radius:22px;
    overflow-y:auto;box-shadow:0 40px 100px -20px rgba(0,0,0,.9);
    animation:modalIn .3s cubic-bezier(.2,.7,.3,1);
    scrollbar-width:thin;scrollbar-color:#2b3947 transparent;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
  .modal-close{
    position:absolute;top:12px;right:12px;z-index:3;width:36px;height:36px;
    background:rgba(0,0,0,.55);border:0;border-radius:50%;color:#fff;cursor:pointer;
    display:grid;place-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    transition:background .15s;
  }
  .modal-close:hover{background:rgba(0,0,0,.8)}
  .modal-hero{position:relative;aspect-ratio:16/9;overflow:hidden;background:#0a0f15}
  .modal-hero img{width:100%;height:100%;object-fit:cover;display:block}
  .hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(10,15,21,.92) 100%)}
  .hero-meta{position:absolute;left:20px;right:20px;bottom:16px;text-shadow:0 2px 10px rgba(0,0,0,.85)}
  .hero-title{font-size:22px;font-weight:700;letter-spacing:-.2px;line-height:1.15}
  .hero-sub{font-size:13px;color:#c6d2dd;margin-top:5px}
  .modal-body{padding:20px}
  .stats{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .stat{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  .stat b{color:var(--text);font-weight:600}
  .stat.star b{color:#ffb400}
  .desc{font-size:14px;line-height:1.55;color:#c6d2dd;margin:0 0 16px}
  .shots{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:#2b3947 transparent}
  .shots img{flex:0 0 62%;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--border);display:block}

  .btn-play{
    position:relative;width:100%;height:48px;border:0;border-radius:12px;
    overflow:hidden;cursor:pointer;color:#fff;font-size:15px;font-weight:600;font-family:inherit;
    background:linear-gradient(135deg,#059669,#10b981,#22c55e,#34d399,#22c55e,#10b981);
    background-size:300% 300%;animation:gradientShift 8s ease infinite;
    box-shadow:0 6px 20px -4px rgba(5,150,105,.4);
    transition:transform .12s ease,box-shadow .25s ease;
  }
  .btn-play::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -2px 6px rgba(0,0,0,.15);pointer-events:none;z-index:2}
  .btn-play span{position:relative;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.3)}
  .btn-play:hover{box-shadow:0 0 40px rgba(34,197,94,.55),0 8px 24px -4px rgba(5,150,105,.5)}
  .btn-play:active{transform:scale(.98)}

  .extra-buttons{display:flex;gap:8px;margin-top:10px}
  .btn-schedule{
    position:relative;flex:1;height:46px;border:0;border-radius:12px;
    background:transparent;overflow:hidden;
    color:#fff;font-size:14px;font-weight:600;font-family:inherit;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 4px 16px -4px rgba(14,165,233,.55);
    text-shadow:0 1px 2px rgba(0,0,0,.35);
    transition:box-shadow .25s ease,transform .12s ease;
  }
  .btn-schedule::before{
    content:'';position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(135deg,#0284c7,#0ea5e9,#38bdf8,#7dd3fc,#e0f2fe,#38bdf8,#0ea5e9);
    background-size:300% 300%;animation:gradientShift 6s ease infinite;z-index:0;
    transition:filter .45s ease;
  }
  .btn-schedule.bookmarked::before{filter:grayscale(1)}
  .btn-schedule.bookmarked{box-shadow:0 4px 16px -4px rgba(120,120,120,.5)}
  .btn-schedule > span{position:relative;z-index:1}
  .btn-schedule .bm-icon{font-size:16px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
  .btn-schedule:hover{box-shadow:0 0 30px rgba(56,189,248,.6),0 6px 20px -4px rgba(14,165,233,.5)}
  .btn-schedule.bookmarked:hover{box-shadow:0 0 20px rgba(160,160,160,.45),0 6px 20px -4px rgba(100,100,100,.4)}
  .btn-schedule:active{transform:scale(.98)}

  .btn-like{
    flex:0 0 46px;width:46px;height:46px;
    background:linear-gradient(135deg,#7c2d12,#b91c1c,#dc2626,#ec4899,#b91c1c,#7c2d12);
    background-size:300% 300%;animation:gradientShift 6s ease infinite;
    border:0;border-radius:12px;color:#fff;font-size:22px;line-height:1;
    cursor:pointer;display:grid;place-items:center;
    box-shadow:0 4px 16px -4px rgba(220,38,38,.55);
    transition:transform .12s ease,box-shadow .25s ease,background .35s ease;
  }
  .btn-like:hover{box-shadow:0 0 30px rgba(236,72,153,.6),0 6px 20px -4px rgba(220,38,38,.5)}
  .btn-like:active{transform:scale(.94)}
  .btn-like.liked{
    background:linear-gradient(135deg,#059669,#10b981,#22c55e,#34d399,#22c55e,#10b981);
    background-size:300% 300%;
    box-shadow:0 0 24px rgba(34,197,94,.55),0 4px 16px -4px rgba(5,150,105,.5);
  }

  /* Комментарии */
  .comments-section{
    margin-top:18px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;
    padding:14px 14px 6px;
  }
  .comments-head{
    display:flex;align-items:center;gap:8px;
    font-size:14px;font-weight:600;color:var(--text);
    margin-bottom:12px;
  }
  .comments-count{
    background:rgba(42,171,238,.18);color:var(--accent);
    font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;
    letter-spacing:.3px;
  }
  .comments-list{display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
  .comment{display:flex;gap:10px}
  .comment-avatar{
    width:34px;height:34px;flex:0 0 34px;border-radius:50%;
    display:grid;place-items:center;
    font-size:13px;font-weight:700;color:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.15);
  }
  .comment-body{flex:1;min-width:0}
  .comment-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px;font-size:12px;line-height:1.2}
  .comment-nick{font-weight:600;font-size:13px}
  .comment-nick.regular{color:#c6d2dd}

  .comment-nick.vip{
    background-image:linear-gradient(90deg,#ff006e,#fb5607,#ffbe0b,#06d6a0,#3a86ff,#8338ec,#ff006e);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:vipFlow 5s linear infinite;
  }
  .comment-badge.vip{
    background-image:linear-gradient(90deg,#ff006e,#fb5607,#ffbe0b,#06d6a0,#3a86ff,#8338ec,#ff006e);
    background-size:300% 100%;animation:vipFlow 5s linear infinite;
  }
  .comment-nick.coupon-blue{
    background-image:linear-gradient(90deg,#0369a1,#0ea5e9,#38bdf8,#7dd3fc,#22d3ee,#0ea5e9,#0369a1);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:gradientShift 4s ease infinite;
  }
  .comment-badge.coupon-blue{
    background-image:linear-gradient(90deg,#0369a1,#0ea5e9,#38bdf8,#7dd3fc,#22d3ee,#0ea5e9,#0369a1);
    background-size:300% 100%;animation:gradientShift 4s ease infinite;
  }
  .comment-nick.coupon-orange{
    background-image:linear-gradient(90deg,#b45309,#ea580c,#f97316,#f59e0b,#d97706,#92400e,#b45309);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:gradientShift 4s ease infinite;
  }
  .comment-badge.coupon-orange{
    background-image:linear-gradient(90deg,#b45309,#ea580c,#f97316,#f59e0b,#d97706,#92400e,#b45309);
    background-size:300% 100%;animation:gradientShift 4s ease infinite;
  }
  .comment-badge{
    display:inline-flex;align-items:center;
    font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    padding:2px 6px;border-radius:6px;
    color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);
    box-shadow:0 1px 4px rgba(0,0,0,.3);
  }
  .comment-time{color:var(--muted-2);font-size:11px;margin-left:auto}
  .comment-text{font-size:13px;line-height:1.45;color:#c6d2dd;word-wrap:break-word}

  /* Страница загрузки */
  .download-page{position:fixed;inset:0;z-index:400;display:flex;flex-direction:column;background:var(--bg);opacity:0;transition:opacity .3s ease}
  .download-page.open{opacity:1}
  .download-page[hidden]{display:none}
  .dl-top{position:relative;flex:0 0 auto;height:clamp(180px,32vh,300px);overflow:hidden;background:#0a0f15}
  .dl-hero{width:100%;height:100%;object-fit:cover;display:block}
  .dl-hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,17,26,.35) 0%,transparent 35%,rgba(11,17,26,.95) 100%)}
  .dl-hero-info{position:absolute;left:24px;right:24px;bottom:18px}
  .dl-title{font-size:23px;font-weight:700;line-height:1.15;letter-spacing:-.3px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.85)}
  .dl-sub{font-size:13px;color:#c6d2dd;margin-top:5px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
  .dl-close{position:absolute;top:14px;right:14px;z-index:3;width:36px;height:36px;background:rgba(0,0,0,.55);border:0;border-radius:50%;color:#fff;cursor:pointer;display:grid;place-items:center;font-size:15px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .15s}
  .dl-close:hover{background:rgba(0,0,0,.8)}
  .dl-center{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .dl-loader{position:relative;width:140px;height:140px;display:grid;place-items:center}
  .dl-ring{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
  .dl-ring-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:5}
  .dl-ring-fg{fill:none;stroke:url(#dlGrad);stroke-width:5;stroke-linecap:round;stroke-dasharray:276.46;stroke-dashoffset:276.46;transition:stroke-dashoffset .35s linear;filter:drop-shadow(0 0 8px rgba(139,92,246,.55))}
  .dl-pulse{position:absolute;inset:20px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.35) 0%,transparent 70%);animation:dlPulse 2s ease-in-out infinite;pointer-events:none}
  @keyframes dlPulse{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.15);opacity:1}}
  .dl-percent{position:absolute;font-size:24px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-.5px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
  .dl-status{margin-top:22px;font-size:15px;font-weight:500;color:var(--text);text-align:center}
  .dl-tip{margin-top:6px;font-size:12px;color:var(--muted-2);text-align:center}
  .dl-bottom{flex:0 0 auto;padding:14px 20px max(14px,env(safe-area-inset-bottom));background:rgba(23,33,43,.92);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px}
  .dl-user{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .dl-avatar{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:linear-gradient(135deg,#c73a26,#d4a017,#ff8c00,#c73a26);background-size:300% 300%;animation:gradientShift 6s ease infinite;display:grid;place-items:center;color:#fff;box-shadow:0 0 16px rgba(199,58,38,.4)}
  .dl-avatar svg{width:18px;height:18px;stroke:#fff;stroke-width:2;fill:none}
  .dl-user-info{min-width:0}
  .dl-user-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dl-user-sub{font-size:11px;color:var(--muted-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dl-actions{display:flex;gap:8px;flex:0 0 auto}
  .dl-btn-cancel,.dl-btn-open{height:42px;border:0;border-radius:12px;font-family:inherit;font-size:14px;font-weight:600;padding:0 18px;cursor:pointer;transition:transform .1s ease,box-shadow .2s ease,filter .15s ease}
  .dl-btn-cancel{background:var(--panel-2);border:1px solid var(--border);color:var(--text)}
  .dl-btn-cancel:hover{background:#223040}
  .dl-btn-cancel:active{transform:scale(.97)}
  .dl-btn-open{background:#4b5563;color:#9ca3af;cursor:not-allowed}
  .dl-btn-open.ready{
    background:linear-gradient(135deg,#059669,#10b981,#22c55e,#34d399,#22c55e,#10b981);
    background-size:300% 300%;
    animation:gradientShift 3s ease infinite,glowPulse 1.6s ease-in-out infinite;
    color:#fff;cursor:pointer;
  }
  .dl-btn-open.ready:hover{filter:brightness(1.08)}
  .dl-btn-open.ready:active{transform:scale(.97)}
  @keyframes glowPulse{
    0%,100%{box-shadow:0 0 20px rgba(34,197,94,.5),0 4px 16px -4px rgba(5,150,105,.4)}
    50%{box-shadow:0 0 40px rgba(34,197,94,.85),0 4px 16px -4px rgba(5,150,105,.6)}
  }

  @media (max-width:640px){
    .browser-bar{padding:6px 12px 8px;gap:8px}
    .nav-btn{width:30px;height:30px}
    .address-bar{height:32px;font-size:12px;padding:0 10px}
    .viewport{padding:16px 12px}
    .composer{padding:8px 12px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
    .popover{left:12px}.popover.emoji-panel{right:52px;width:264px}
    .modal{padding:12px}.modal-window{border-radius:18px}
    .hero-title{font-size:19px}.shots img{flex:0 0 74%;height:96px}
    .bubble{font-size:14px;max-width:220px}
    .context-menu,.bg-menu{min-width:220px}
    .dl-user-name{font-size:12px}.dl-title{font-size:20px}
    .card-actions{width:190px}
  }
  @media (max-height:560px){
    .composer{padding-top:6px;padding-bottom:6px}
    .banner-slot{padding:16px}
    .dl-top{height:140px}
  }
</style>
</head>
<body>

<div class="page">

  <div class="bg-layer" id="bgLayer" data-bg="autumn" data-pattern="none">
    <div class="bg-gradient"></div>
    <div class="bg-glow"></div>
    <div class="pattern"></div>
  </div>

  <div class="browser-bar">
    <button class="nav-btn" id="navBack" title="Назад" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="nav-btn" id="navFwd" title="Вперёд" aria-label="Вперёд"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <div class="address-bar">
      <span class="lock"><svg viewBox="0 0 24 24"><path d="M12 1a5 5 0 00-5 5v3H5a2 2 0 00-2 2v10a2 2 0 002 2h14a2 2 0 002-2V11a2 2 0 00-2-2h-2V6a5 5 0 00-5-5zm-3 8V6a3 3 0 016 0v3H9z"/></svg></span>
      <span class="path"><b>telegram.app</b><span class="sep">/</span><span class="leaf">Хранилище</span></span>
    </div>
  </div>

  <main class="viewport" id="viewport">
    <div class="bubble-layer" id="bubbleLayer"></div>
    <div class="banner-slot" id="bannerSlot">
      <div class="stage" id="stage"><div class="track" id="track"></div></div>
    </div>
  </main>

  <footer class="composer">
    <div class="composer-row">
      <button class="avatar-btn" id="account" title="Аккаунт" aria-label="Аккаунт">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a6 6 0 0 1 12 0v2"/></svg>

<script>
(function () {
  'use strict';

  document.addEventListener('selectstart', (e) => { if (e.target.id !== 'msg') e.preventDefault(); });
  document.addEventListener('copy',       (e) => { if (e.target.id !== 'msg') e.preventDefault(); });
  document.addEventListener('dragstart',  (e) => { if (e.target.tagName === 'IMG') e.preventDefault(); });

  const GAMES = [
    { id:'starfall',  title:'Starfall Odyssey',  genre:'Космический шутер', rating:4.8, downloads:'12M', desc:'Отправляйтесь в эпическое путешествие сквозь неизведанные галактики.' },
    { id:'dragon',    title:"Dragon's Realm",    genre:'Ролевая игра',      rating:4.6, downloads:'8.5M', desc:'Погрузитесь в мир магии и драконов.' },
    { id:'neon',      title:'Neon Racer',        genre:'Гонки',             rating:4.7, downloads:'15M', desc:'Мчитесь по неоновым трассам будущего.' },
    { id:'mystic',    title:'Mystic Forest',     genre:'Головоломка',       rating:4.5, downloads:'6.2M', desc:'Разгадайте тайны волшебного леса.' },
    { id:'pixel',     title:'Pixel Warriors',    genre:'Файтинг',           rating:4.4, downloads:'10M', desc:'Сражайтесь в пиксельных битвах.' },
    { id:'skycastle', title:'Sky Castle',        genre:'Строительство',     rating:4.9, downloads:'20M', desc:'Постройте собственный замок в облаках.' },
    { id:'ocean',     title:'Ocean Quest',       genre:'Приключение',       rating:4.6, downloads:'7.8M', desc:'Исследуйте глубины океана.' },
    { id:'shadow',    title:'Shadow Strike',     genre:'Стелс',             rating:4.5, downloads:'9.3M', desc:'Проберитесь незамеченным через охраняемые объекты.' },
    { id:'cyber',     title:'Cyber Arena',       genre:'Арена',             rating:4.7, downloads:'11M', desc:'Сражайтесь на кибернетических аренах будущего.' },
    { id:'crystal',   title:'Crystal Kingdom',   genre:'Стратегия',         rating:4.8, downloads:'14M', desc:'Управляйте кристальным королевством.' }
  ];

  function generateVisits(g, n = 14) {
    const seed = g.id.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
    const arr = [];
    for (let i = 0; i < n; i++) {
      const base = 300 + Math.abs(Math.sin(seed * 0.53 + i * 1.31)) * 1200;
      const noise = Math.abs(Math.cos(seed * 0.91 + i * 2.17)) * 350;
      arr.push(Math.round(base + noise));
    }
    return arr;
  }
  GAMES.forEach(g => { g.visits = generateVisits(g); });

  const gameFor   = (L) => { const len = GAMES.length; return GAMES[((L % len) + len) % len]; };
  const cardImage = (g) => `https://picsum.photos/seed/${g.id}/1040/440`;
  const heroImage = (g) => `https://picsum.photos/seed/${g.id}h/1200/500`;
  const shotImage = (g, i) => `https://picsum.photos/seed/${g.id}s${i}/600/338`;

  function sparklineSVG(arr) {
    const W = 44, H = 16, PAD = 2;
    const min = Math.min.apply(null, arr);
    const max = Math.max.apply(null, arr);
    const range = (max - min) || 1;
    const n = arr.length;
    const points = arr.map((v, i) => {
      const x = (i / (n - 1)) * W;
      const y = PAD + (H - PAD * 2) * (1 - (v - min) / range);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    const today = arr[n - 1], yesterday = arr[n - 2];
    const color = today > yesterday ? '#38ef7d' : today < yesterday ? '#f12711' : '#94a3b8';
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }

  const VIEWS_ICON = `<svg viewBox="0 0 24 24"><path d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 11a4 4 0 110-8 4 4 0 010 8z"/></svg>`;

  /* Шаблоны комментариев — сохранены из v15 */
  const COMMENT_TEMPLATES = [
    { nick:'NeonRider',      tier:'vip',           initial:'N', time:'2 мин',   text:'Лучшая графика в этом жанре. Атмосфера просто топ — залипаю каждый вечер!' },
    { nick:'EcoGamer',       tier:'coupon-blue',   initial:'E', time:'15 мин',  text:'Забрал по купону на праздник — не пожалел. Затягивает с первых минут.' },
    { nick:'Alex_80',        tier:'none',          initial:'A', time:'1 ч',     text:'Неплохо, но управление местами неудобное. Поставил 7/10.' },
    { nick:'GoldenPhoenix',  tier:'vip',           initial:'G', time:'2 ч',     text:'Жду обновление с новыми локациями. Разрабы — молодцы!' },
    { nick:'SunnyDay',       tier:'coupon-orange', initial:'S', time:'3 ч',     text:'Взял по акции — очень приятный бонус к игре. Советую попробовать.' },
    { nick:'PlayerOne',      tier:'none',          initial:'P', time:'5 ч',     text:'Играю неделю, пока не надоедает. Рекомендую друзьям.' },
    { nick:'CrystalMage',    tier:'vip',           initial:'C', time:'8 ч',     text:'Магия и графика на высоте. Сюжет реально цепляет.' },
    { nick:'VasyaPupkin',    tier:'none',          initial:'V', time:'12 ч',    text:'Норм, но можно было бы и подешевле. В целом доволен.' }
  ];

  function renderComments() {
    const list = document.getElementById('mComments');
    const countEl = document.getElementById('mCommentsCount');
    const picked = [...COMMENT_TEMPLATES].sort(() => Math.random() - 0.5).slice(0, 6);
    countEl.textContent = picked.length;
    list.innerHTML = picked.map(c => {
      const badgeLabel = c.tier === 'vip' ? 'VIP'
                        : c.tier === 'coupon-blue' ? 'КУПОН'
                        : c.tier === 'coupon-orange' ? 'АКЦИЯ'
                        : '';
      const nickClass = c.tier === 'none' ? 'comment-nick regular' : `comment-nick ${c.tier}`;
      const badgeHTML = badgeLabel ? `<span class="comment-badge ${c.tier}">${badgeLabel}</span>` : '';
      const avatarBg =
        c.tier === 'vip'            ? 'linear-gradient(135deg,#8338ec,#ff006e)' :
        c.tier === 'coupon-blue'    ? 'linear-gradient(135deg,#0ea5e9,#0369a1)' :
        c.tier === 'coupon-orange'  ? 'linear-gradient(135deg,#f97316,#b45309)' :
                                      'linear-gradient(135deg,#475569,#334155)';
      return `
        <div class="comment">
          <div class="comment-avatar" style="background:${avatarBg}">${c.initial}</div>
          <div class="comment-body">
            <div class="comment-meta">
              <span class="${nickClass}">${c.nick}</span>
              ${badgeHTML}
              <span class="comment-time">${c.time}</span>
            </div>
            <div class="comment-text">${c.text}</div>
          </div>
        </div>`;
    }).join('');
  }

  /* ═══════════════════════════════════════════════════════════════
     Lenis-подобный бесконечный 3D-скролл (damp + lerp)
     ═══════════════════════════════════════════════════════════════ */
  const POOL = 21, HALF = Math.floor(POOL / 2), START = 1000000, GAP = 12;
  const TILT_STEP = 24, MAX_TILT = 52, DEPTH = 36;
  const LERP_LAMBDA = 9, MAX_DRIFT = 10, MIN_DELTA = 0.0008;

  const viewport = document.getElementById('viewport');
  const banner   = document.getElementById('bannerSlot');
  const stage    = document.getElementById('stage');
  const track    = document.getElementById('track');

  let visualPosition = START, targetPosition = START, current = START;
  let rafId = null, lastTime = 0, isAnimating = false, step = 0;

  /* ═══════════════════════════════════════════════════════════════
     v16 П.2: ХЕЛПЕР ДЛЯ КНОПКИ «⋮» И ПАНЕЛИ ДЕЙСТВИЙ НА КАРТОЧКЕ
     ═══════════════════════════════════════════════════════════════ */
  const DOTS_SVG = `<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>`;
  const ACTIONS_HTML = `
    <button data-card-act="about-ad"><span class="ico">ℹ️</span>О рекламе</button>
    <button data-card-act="report-issue"><span class="ico">⚠️</span>Сообщить о проблеме</button>
    <button data-card-act="report-violation"><span class="ico">🚩</span>Сообщить о нарушении</button>
    <button data-card-act="block" class="danger"><span class="ico">🚫</span>Заблокировать</button>`;

  const cards = [];
  for (let i = 0; i < POOL; i++) {
    const L = START - HALF + i;
    const g = gameFor(L);
    const el = document.createElement('article');
    el.className = 'card';
    el.dataset.logical = L;
    el.innerHTML = `
      <img src="${cardImage(g)}" alt="" loading="lazy">
      <button class="card-dots" type="button" aria-label="Меню карточки">${DOTS_SVG}</button>
      <div class="card-actions" role="menu">${ACTIONS_HTML}</div>
      <div class="score-corner">
        <div class="score-cell rating"><span>★</span><span class="num">${g.rating.toFixed(1)}</span></div>
        <div class="score-cell chart">${sparklineSVG(g.visits)}</div>
      </div>
      <div class="card-body">
        <div class="card-title">${g.title}</div>
        <div class="card-meta">
          <span class="views">${VIEWS_ICON}<span>${g.downloads}</span></span>
          <span class="dot"></span>
          <span>${g.genre}</span>
        </div>
      </div>`;
    track.appendChild(el);
    cards.push(el);
  }

  /* Обновление контента при рециклинге. Кнопка «⋮» и панель
     действий сохраняются — меняется только содержимое. */
  function updateContent(card, L) {
    card.dataset.logical = L;
    const g = gameFor(L);
    card.querySelector('img').src = cardImage(g);
    card.querySelector('.score-corner').innerHTML = `
      <div class="score-cell rating"><span>★</span><span class="num">${g.rating.toFixed(1)}</span></div>
      <div class="score-cell chart">${sparklineSVG(g.visits)}</div>`;
    card.querySelector('.card-title').textContent = g.title;
    card.querySelector('.card-meta').innerHTML = `
      <span class="views">${VIEWS_ICON}<span>${g.downloads}</span></span>
      <span class="dot"></span>
      <span>${g.genre}</span>`;
    /* При рециклинге закрываем панель, если была открыта */
    closeCardActions(card);
  }

  /* ═══════════════════════════════════════════════════════════════
     v16 П.2: ЛОГИКА ПАНЕЛИ «⋮»
     ───────────────────────────────────────────────────────────────
     • openCardActions(card) — открывает панель, скрывает точки
     • closeCardActions(card) — закрывает панель, возвращает точки
     • closeAllCardActions() — закрыть на всех карточках
     • Клик вне панели / Esc — закрыть
     ═══════════════════════════════════════════════════════════════ */
  function openCardActions(card) {
    closeAllCardActions();
    card.classList.add('card-actions-open');
    const panel = card.querySelector('.card-actions');
    if (panel) panel.classList.add('open');
  }
  function closeCardActions(card) {
    card.classList.remove('card-actions-open');
    const panel = card.querySelector('.card-actions');
    if (panel) panel.classList.remove('open');
  }
  function closeAllCardActions() {
    cards.forEach(closeCardActions);
  }

  /* Обработчик делегирования: клик по .card-dots или пункту .card-actions */
  stage.addEventListener('click', (e) => {
    /* Клик по кнопке «⋮» */
    const dotsBtn = e.target.closest('.card-dots');
    if (dotsBtn) {
      e.stopPropagation();
      const card = dotsBtn.closest('.card');
      if (card) openCardActions(card);
      return;
    }
    /* Клик по пункту панели действий */
    const actionBtn = e.target.closest('.card-actions button');
    if (actionBtn) {
      e.stopPropagation();
      const act = actionBtn.dataset.cardAct;
      const card = actionBtn.closest('.card');
      console.log('Действие карточки:', act, '— логический индекс:', card && card.dataset.logical);
      if (card) closeCardActions(card);
      return;
    }
    /* Клик по пустой области панели — игнорируем */
    if (e.target.closest('.card-actions')) {
      e.stopPropagation();
      return;
    }
  });

  /* Глобальное закрытие панели при клике мимо (но не перехватывая
     клики, которые уже обработаны выше — используем capture=false) */
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.card-actions') && !e.target.closest('.card-dots')) {
      closeAllCardActions();
    }
  });

  function measure() {
    const bStyle = getComputedStyle(banner);
    const padX = parseFloat(bStyle.paddingLeft) + parseFloat(bStyle.paddingRight);
    const padY = parseFloat(bStyle.paddingTop) + parseFloat(bStyle.paddingBottom);
    const availW = viewport.clientWidth - 32 - padX;
    const availH = viewport.clientHeight - 40 - padY;
    let cardW = Math.min(520, Math.max(180, availW));
    let cardH = cardW * 220 / 520;
    if (cardH > availH) { cardH = Math.max(100, availH); cardW = cardH * 520 / 220; }
    stage.style.width = cardW + 'px'; stage.style.height = cardH + 'px';
    cards.forEach(c => { c.style.width = cardW + 'px'; c.style.height = cardH + 'px'; });
    step = cardH + GAP;
    renderAt(visualPosition);
  }

  function renderAt(position) {
    for (const card of cards) {
      let L = +card.dataset.logical;
      let d = L - position;
      if (d > HALF) { L -= POOL; updateContent(card, L); d = L - position; }
      else if (d < -HALF) { L += POOL; updateContent(card, L); d = L - position; }
      const ad = Math.abs(d), k = Math.min(ad, 3);
      const rot = Math.max(-MAX_TILT, Math.min(MAX_TILT, -d * TILT_STEP));
      const tz = -k * DEPTH, sc = 1 - k * 0.035;
      const op = ad === 0 ? 1 : Math.max(0, 1 - ad * 0.5);
      const bl = ad === 0 ? 'none' : `blur(${(k * 0.6).toFixed(2)}px)`;
      const y = d * step;
      card.style.transform = `translate(-50%, ${y}px) rotateX(${rot}deg) translateZ(${tz}px) scale(${sc})`;
      card.style.opacity = op;
      card.style.filter = bl;
    }
  }

  function damp(x, y, lambda, dt) { return x + (y - x) * (1 - Math.exp(-lambda * dt)); }

  function tick(now) {
    if (!lastTime) lastTime = now;
    const dt = Math.min((now - lastTime) / 1000, 0.032);
    lastTime = now;
    visualPosition = damp(visualPosition, targetPosition, LERP_LAMBDA, dt);
    renderAt(visualPosition);
    if (Math.abs(targetPosition - visualPosition) < MIN_DELTA) {
      visualPosition = targetPosition;
      current = Math.round(visualPosition);
      renderAt(visualPosition);
      isAnimating = false; lastTime = 0; rafId = null;
      return;
    }
    rafId = requestAnimationFrame(tick);
  }

  function startInertia() {
    if (isAnimating) return;
    isAnimating = true; lastTime = 0;
    rafId = requestAnimationFrame(tick);
  }

  function scrollBy(steps) {
    if (!steps) return;
    const maxT = visualPosition + MAX_DRIFT;
    const minT = visualPosition - MAX_DRIFT;
    targetPosition = Math.max(minT, Math.min(maxT, targetPosition + steps));
    startInertia();
  }

  let wheelAcc = 0;
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    wheelAcc += delta;
    const THRESHOLD = 30;
    if (Math.abs(wheelAcc) < THRESHOLD) return;
    let steps = Math.trunc(wheelAcc / THRESHOLD);
    steps = Math.max(-3, Math.min(3, steps));
    wheelAcc -= steps * THRESHOLD;
    if (steps) scrollBy(steps);
  }, { passive: false });

  let tStartY = 0, tStartX = 0, tMoved = false;
  stage.addEventListener('touchstart', (e) => {
    tStartX = e.touches[0].clientX; tStartY = e.touches[0].clientY; tMoved = false;
  }, { passive: true });
  stage.addEventListener('touchmove', (e) => {
    const dx = e.touches[0].clientX - tStartX;
    const dy = tStartY - e.touches[0].clientY;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) tMoved = true;
    if (Math.abs(dy) > 40) { scrollBy(dy > 0 ? 1 : -1); tStartY = e.touches[0].clientY; }
  }, { passive: true });

  window.addEventListener('keydown', (e) => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'TEXTAREA' || tag === 'INPUT') return;
    if (e.key === 'Escape') {
      closeAllCardActions();
      if (downloadPage.classList.contains('open')) { stopDownload(); return; }
      closeModal(); closeContextMenu(); closeBgMenu();
    }
    if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); scrollBy(1); }
    else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); scrollBy(-1); }
  });

  /* Клик по самой карточке (центральной) → модалка.
     Проверяем, что это не клик по «⋮» и не по панели. */
  stage.addEventListener('click', (e) => {
    if (e.target.closest('.card-dots')) return;
    if (e.target.closest('.card-actions')) return;
    if (tMoved) { tMoved = false; return; }
    const card = e.target.closest('.card');
    if (!card) return;
    if (Math.abs(+card.dataset.logical - visualPosition) > 0.5) return;
    openModal(gameFor(+card.dataset.logical));
  });

  /* Меню ПКМ */
  const contextMenu = document.getElementById('contextMenu');
  const bgMenu      = document.getElementById('bgMenu');
  const bgLayer     = document.getElementById('bgLayer');

  function openContextMenu(x, y) {
    closeBgMenu();
    contextMenu.classList.add('open');
    const mw = contextMenu.offsetWidth, mh = contextMenu.offsetHeight;
    const vw = window.innerWidth, vh = window.innerHeight;
    let left = x, top = y;
    if (left + mw > vw - 8) left = vw - mw - 8;
    if (top + mh > vh - 8) top = vh - mh - 8;
    if (left < 8) left = 8;
    if (top < 8) top = 8;
    contextMenu.style.left = left + 'px';
    contextMenu.style.top = top + 'px';
  }
  function closeContextMenu() { contextMenu.classList.remove('open'); }
  function openBgMenu(x, y) {
    closeContextMenu();
    bgMenu.classList.add('open');
    const mw = bgMenu.offsetWidth, mh = bgMenu.offsetHeight;
    const vw = window.innerWidth, vh = window.innerHeight;
    let left = x, top = y;
    if (left + mw > vw - 8) left = vw - mw - 8;
    if (top + mh > vh - 8) top = vh - mh - 8;
    if (left < 8) left = 8;
    if (top < 8) top = 8;
    bgMenu.style.left = left + 'px';
    bgMenu.style.top = top + 'px';
  }
  function closeBgMenu() { bgMenu.classList.remove('open'); }

  document.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    const card = e.target.closest('.card');
    if (card) openContextMenu(e.clientX, e.clientY);
    else openBgMenu(e.clientX, e.clientY);
  });

  document.addEventListener('click', (e) => {
    if (!contextMenu.contains(e.target)) closeContextMenu();
    if (!bgMenu.contains(e.target)) closeBgMenu();
  });

  contextMenu.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', (e) => { e.stopPropagation(); closeContextMenu(); });
  });
  bgMenu.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      if (b.hasAttribute('data-bg')) {
        bgLayer.setAttribute('data-bg', b.dataset.bg);
        bgMenu.querySelectorAll('button[data-bg]').forEach(x => x.classList.toggle('active', x === b));
      } else if (b.hasAttribute('data-pattern')) {
        bgLayer.setAttribute('data-pattern', b.dataset.pattern);
        bgMenu.querySelectorAll('button[data-pattern]').forEach(x => x.classList.toggle('active', x === b));
      }
    });
  });

  /* Модалка */
  const modal  = document.getElementById('gameModal');
  const mHero  = document.getElementById('mHero');
  const mTitle = document.getElementById('mTitle');
  const mSub   = document.getElementById('mSub');
  const mStats = document.getElementById('mStats');
  const mDesc  = document.getElementById('mDesc');
  const mShots = document.getElementById('mShots');
  const mBookmarks = document.getElementById('mBookmarks');
  const mLike  = document.getElementById('mLike');

  let bookmarks = new Set();
  try { bookmarks = new Set(JSON.parse(localStorage.getItem('tg_bookmarks') || '[]')); } catch (e) {}
  function saveBookmarks() { try { localStorage.setItem('tg_bookmarks', JSON.stringify([...bookmarks])); } catch (e) {} }

  let currentGame = null;

  function syncBookmarksState(g) {
    const isBM = bookmarks.has(g.id);
    mBookmarks.classList.toggle('bookmarked', isBM);
    mBookmarks.querySelector('.bm-icon').textContent = isBM ? '✅' : '🔖';
    mBookmarks.querySelector('.bm-label').textContent = isBM ? 'В закладках' : 'Закладки';
  }

  function openModal(g) {
    currentGame = g;
    mHero.src = heroImage(g);
    mTitle.textContent = g.title;
    mSub.textContent = g.genre;
    const avg = Math.round(g.visits.reduce((a, b) => a + b, 0) / g.visits.length);
    mStats.innerHTML = `
      <div class="stat star"><span>★</span><b>${g.rating.toFixed(1)}</b><span style="color:var(--muted-2)">рейтинг</span></div>
      <div class="stat"><span>⬇</span><b>${g.downloads}</b><span style="color:var(--muted-2)">загрузок</span></div>
      <div class="stat"><span>👁</span><b>${avg.toLocaleString('ru-RU')}</b><span style="color:var(--muted-2)">визитов/день</span></div>
    `;
    mDesc.textContent = g.desc;
    mShots.innerHTML = '';
    for (let i = 1; i <= 4; i++) {
      const img = document.createElement('img');
      img.src = shotImage(g, i); img.alt = ''; img.loading = 'lazy';
      mShots.appendChild(img);
    }
    mLike.classList.remove('liked');
    mLike.querySelector('.like-icon').textContent = '💚';
    syncBookmarksState(g);
    renderComments();
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
  }
  function closeModal() { modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); }
  modal.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeModal));

  mBookmarks.addEventListener('click', () => {
    if (!currentGame) return;
    if (bookmarks.has(currentGame.id)) bookmarks.delete(currentGame.id);
    else bookmarks.add(currentGame.id);
    saveBookmarks();
    syncBookmarksState(currentGame);
  });

  mLike.addEventListener('click', () => {
    const liked = mLike.classList.toggle('liked');
    mLike.querySelector('.like-icon').textContent = liked ? '❤️' : '💚';
  });

  /* Страница загрузки */
  const downloadPage = document.getElementById('downloadPage');
  const dlHero = document.getElementById('dlHero');
  const dlTitle = document.getElementById('dlTitle');
  const dlSub = document.getElementById('dlSub');
  const dlRing = document.getElementById('dlRing');
  const dlPercent = document.getElementById('dlPercent');
  const dlStatus = document.getElementById('dlStatus');
  const dlOpen = document.getElementById('dlOpen');
  const dlGameName = document.getElementById('dlGameName');

  const DL_CIRC = 2 * Math.PI * 44;
  let dlInterval = null, dlProgress = 0;

  function startDownload(g) {
    dlProgress = 0;
    dlPercent.textContent = '0%';
    dlRing.style.strokeDashoffset = DL_CIRC;
    dlStatus.textContent = 'Подготовка...';
    dlOpen.disabled = true;
    dlOpen.classList.remove('ready');
    dlOpen.textContent = 'Открыть';
    dlHero.src = heroImage(g);
    dlTitle.textContent = g.title;
    dlSub.textContent = g.genre + ' · ' + g.downloads + ' загрузок';
    dlGameName.textContent = g.title;
    downloadPage.hidden = false;
    requestAnimationFrame(() => downloadPage.classList.add('open'));
    if (dlInterval) clearInterval(dlInterval);
    dlInterval = setInterval(() => {
      const remaining = 100 - dlProgress;
      const step = Math.max(0.5, Math.min(3.5, remaining * 0.06 + Math.random() * 1.8));
      dlProgress = Math.min(100, dlProgress + step);
      dlPercent.textContent = Math.round(dlProgress) + '%';
      dlRing.style.strokeDashoffset = DL_CIRC * (1 - dlProgress / 100);
      if (dlProgress < 30) dlStatus.textContent = 'Подготовка...';
      else if (dlProgress < 70) dlStatus.textContent = 'Загрузка ресурсов...';
      else if (dlProgress < 100) dlStatus.textContent = 'Почти готово...';
      if (dlProgress >= 100) {
        dlPercent.textContent = '100%';
        dlRing.style.strokeDashoffset = 0;
        dlStatus.textContent = 'Готово!';
        dlOpen.disabled = false;
        dlOpen.classList.add('ready');
        clearInterval(dlInterval); dlInterval = null;
      }
    }, 80);
  }
  function stopDownload() {
    if (dlInterval) { clearInterval(dlInterval); dlInterval = null; }
    downloadPage.classList.remove('open');
    setTimeout(() => { downloadPage.hidden = true; }, 300);
  }
  document.getElementById('dlClose').addEventListener('click', stopDownload);
  document.getElementById('dlCancel').addEventListener('click', stopDownload);
  dlOpen.addEventListener('click', () => { if (!dlOpen.disabled) stopDownload(); });
  document.getElementById('mPlay').addEventListener('click', () => {
    const g = currentGame;
    if (!g) return;
    closeModal();
    setTimeout(() => startDownload(g), 180);
  });

  /* Пузыри */
  const bubbleLayer = document.getElementById('bubbleLayer');
  const MAX_BUBBLES = 10, BUBBLE_TTL = 20000;
  let bubbleCount = 0;

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function spawnBubble(text) {
    if (bubbleCount >= MAX_BUBBLES) {
      const oldest = bubbleLayer.querySelector('.bubble');
      if (oldest) { oldest.classList.add('out'); setTimeout(() => oldest.remove(), 320); bubbleCount--; }
    }
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    bubble.innerHTML = escapeHtml(text) + `<span class="time">${time}</span>`;
    bubble.style.visibility = 'hidden'; bubble.style.left = '0px'; bubble.style.top = '0px';
    bubbleLayer.appendChild(bubble);
    const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const margin = 12;
    const maxX = Math.max(margin, vw - bw - margin);
    const maxY = Math.max(margin, vh - bh - margin);
    bubble.style.left = (margin + Math.random() * (maxX - margin)) + 'px';
    bubble.style.top  = (margin + Math.random() * (maxY - margin)) + 'px';
    bubble.style.visibility = '';
    bubbleCount++;
    setTimeout(() => {
      if (bubble.parentNode) {
        bubble.classList.add('out');
        setTimeout(() => { if (bubble.parentNode) bubble.remove(); bubbleCount--; }, 320);
      }
    }, BUBBLE_TTL);
  }

  /* Композер */
  const msg = document.getElementById('msg');
  msg.addEventListener('input', () => { msg.style.height = 'auto'; msg.style.height = Math.min(msg.scrollHeight, 120) + 'px'; });
  function doSend() {
    const text = msg.value.trim();
    if (!text) return;
    spawnBubble(text);
    msg.value = ''; msg.style.height = 'auto'; msg.focus();
  }
  document.getElementById('send').addEventListener('click', doSend);
  msg.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); } });

  const accountBtn = document.getElementById('account'), accountMenu = document.getElementById('accountMenu');
  const attachBtn  = document.getElementById('attach'),  attachMenu  = document.getElementById('attachMenu');
  const emojiBtn   = document.getElementById('emojiBtn'), emojiPanel  = document.getElementById('emojiPanel');

  function closeAllPopovers() {
    accountMenu.classList.remove('open'); attachMenu.classList.remove('open'); emojiPanel.classList.remove('open');
  }
  function bindToggle(btn, panel) {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const wasOpen = panel.classList.contains('open');
      closeAllPopovers();
      if (!wasOpen) panel.classList.add('open');
    });
    panel.addEventListener('click', (e) => e.stopPropagation());
  }
  bindToggle(accountBtn, accountMenu); bindToggle(attachBtn, attachMenu); bindToggle(emojiBtn, emojiPanel);
  document.addEventListener('click', closeAllPopovers);

  accountMenu.querySelectorAll('button').forEach(b => { b.addEventListener('click', () => closeAllPopovers()); });
  attachMenu.querySelectorAll('button').forEach(b => { b.addEventListener('click', () => closeAllPopovers()); });

  const EMOJI_PACK = ['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😋','😛','😝','😜','🤪','🤨','🧐','🤓','😎','🥳','😏','😒','😞','😔','😟','😕','🙁','😣','😖','😫','😩','🥺','😢','😭','😤'];
  const emojiGrid = document.getElementById('emojiGrid');
  EMOJI_PACK.forEach(emoji => {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.textContent = emoji;
    btn.addEventListener('click', () => insertAtCursor(emoji));
    emojiGrid.appendChild(btn);
  });

  function insertAtCursor(text) {
    const start = msg.selectionStart || 0, end = msg.selectionEnd || 0, val = msg.value;
    msg.value = val.slice(0, start) + text + val.slice(end);
    const pos = start + text.length;
    msg.setSelectionRange(pos, pos); msg.focus(); msg.dispatchEvent(new Event('input'));
  }

  /* Браузерная панель */
  const navBack = document.getElementById('navBack');
  const navFwd  = document.getElementById('navFwd');
  navBack.addEventListener('click', () => { if (history.length > 1) history.back(); });
  navFwd.addEventListener('click',  () => { history.forward(); });
  navBack.disabled = history.length <= 1;

  /* Запуск */
  requestAnimationFrame(() => { measure(); });
  let rzT = null;
  window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(measure, 120); });
  window.addEventListener('load', measure);
})();
</script>
</body>
</html>
